
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Daniel Rose — Independent Musician since 2016 with roots in 70's folk-indie & americana">
<title>Daniel Rose — Albums/title>
<style>
:root {
  --bg: #f9e1d1;
  --text: #800b0b;
  --muted: #f9e1d1;
  --accent: #3f0505;
  --border: #3f0505;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.7;
}
a { color: inherit; text-decoration: none; }
.container { width: min(1100px, calc(100% - 40px)); margin: auto; }
section { padding: 90px 0; }
h1,h2,h3 { line-height: 1.15; letter-spacing: -.04em; font-weight: 550; }
h1 { font-size: clamp(3.2rem, 8vw, 6.5rem); }
h2 { font-size: clamp(2.2rem, 5vw, 3.5rem); }
h3 { font-size: 1.3rem; }
p { color: var(--muted); }
.eyebrow {
  color: var(--accent); text-transform: uppercase;
  letter-spacing: .16em; font-size: .76rem; font-weight: 700;
  margin-bottom: 18px;
}
header {
  position: sticky; top: 0; z-index: 5;
  background: rgba(248,248,245,.95); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
}
nav { min-height: 72px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 1.2rem; font-weight: 750; }
.logo span, h1 span { color: var(--accent); }
.nav-links { display: flex; gap: 28px; list-style: none; font-size: .9rem; }
.nav-links a:hover { color: var(--accent); }
.menu-toggle {
  display: none; padding: 8px 12px; background: white;
  border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
}
.hero { padding: 95px 0; }
.hero-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 65px; align-items: center; }
.hero-description { margin-top: 25px; max-width: 480px; font-size: 1.08rem; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
.btn {
  display: inline-block; padding: 12px 21px; border-radius: 50px;
  border: 1px solid var(--text); background: var(--text); color: white;
  font-size: .9rem; transition: .2s;
}
.btn:hover { background: var(--accent); border-color: var(--accent); }
.btn-light { background: transparent; color: var(--text); border-color: var(--border); }
.hero-image { height: 450px; border-radius: 180px 180px 20px 20px; overflow: hidden; }
.hero-image img, .project img { width: 100%; height: 100%; object-fit: cover; }
.hero-note { margin-top: 28px; font-size: .82rem; }
.albums { background: white; }
.heading-row { display: flex; justify-content: space-between; gap: 30px; align-items: end; margin-bottom: 38px; }
.heading-row p { max-width: 400px; }
.projects { display: grid; grid-template-columns: repeat(2,1fr); gap: 35px 24px; }
.project img { height: 300px; border-radius: 16px; transition: transform .3s; }
.project:hover img { transform: scale(1.02); }
.project h3 { margin-top: 17px; }
.project p { font-size: .88rem; }
.about-grid { display: grid; grid-template-columns: .8fr 1.2fr; gap: 70px; align-items: center; }
.initials {
  display: grid; place-items: center; min-height: 320px;
  background: #e8e9e1; border-radius: 18px; color: var(--accent);
  font-size: 7rem; font-weight: 700; letter-spacing: -.08em;
}
.about-copy p { margin-top: 20px; }
.about-copy .btn { margin-top: 25px; }
.services { background: #eeefe9; }
.services-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; margin-top: 40px; }
.service {
  padding: 28px; background: rgba(255,255,255,.6);
  border: 1px solid #dedfd6; border-radius: 16px;
}
.service small { display: block; color: var(--accent); margin-bottom: 30px; }
.service p { margin-top: 12px; font-size: .92rem; }
.contact-grid { display: grid; grid-template-columns: 1fr .8fr; gap: 65px; }
.contact-copy p { margin-top: 20px; }
.contact-links { margin-top: 10px; }
.contact-link {
  display: flex; justify-content: space-between; align-items: center;
  gap: 15px; padding: 19px 0; border-bottom: 1px solid var(--border);
}
.contact-link:first-child { border-top: 1px solid var(--border); }
.contact-link small { display: block; color: var(--muted); }
.contact-link strong { font-size: .95rem; font-weight: 550; overflow-wrap: anywhere; }
.arrow { color: var(--accent); }
footer { border-top: 1px solid var(--border); padding: 26px 0; }
.footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; }
footer p, footer a { font-size: .82rem; color: var(--muted); }
@media(max-width:800px) {
  section { padding: 70px 0; }
  .hero-grid,.about-grid,.contact-grid { grid-template-columns: 1fr; gap: 35px; }
  .hero-image { height: 400px; }
  .services-grid { grid-template-columns: 1fr; }
  .heading-row { align-items: start; flex-direction: column; }
}
@media(max-width:600px) {
  .menu-toggle { display: block; }
  .nav-links {
    display: none; position: absolute; top: 72px; left: 0; right: 0;
    background: var(--bg); padding: 20px; border-bottom: 1px solid var(--border);
    flex-direction: column; gap: 15px;
  }
  .nav-links.open { display: flex; }
  .projects { grid-template-columns: 1fr; }
  .project img { height: 250px; }
  .hero-image { height: 340px; }
}
@media(prefers-reduced-motion:reduce) {
  html { scroll-behavior: auto; }
  *,*::before,*::after { transition: none !important; }
}
</style>
</head>
<body>

<header>
  <nav class="container">
    <a class="logo" href="#home">Daniel Rose<span>.</span></a>
    <button class="menu-toggle" id="menuToggle" aria-expanded="false"
      aria-controls="navLinks">Menu ☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="#albums">albums</a></li>
      <li><a href="#about">About my music</a></li>
      <li><a href="#contact">Contact ↗</a></li>
    </ul>
  </nav>
</header>

<main>
<section class="hero" id="home">
  <div class="container hero-grid">
    <div>
      <p class="eyebrow">This is Daniel Rose</p>
      <p class="hero-description">
        Playing music is coming home to me
      </p>
      <div class="actions">
        <a class="btn" href="#albums">Explore my work ↗</a>
        <a class="btn btn-light" href="#about">About my music</a>
      </div>
      <p class="hero-note">Independent · Experimental · Timeless</p>
    </div>
    <div class="hero-image">
      <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1000&q=85"
        alt="Peaceful landscape">
    </div>
  </div>
</section>

<section class="albums" id="albums">
  <div class="container">
    <div class="heading-row">
      <div><p class="eyebrow">Selected work</p><h2>albums.</h2></div>
      <p>A Daniel Rose albums.</p>
    </div>
    <div class="projects">
      <article class="project">
        <img loading="lazy" src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=900&q=85" alt="Minimalist workspace">
        <h3>Project One</h3><p>Creativity & concepts</p>
      </article>
      <article class="project">
        <img loading="lazy" src="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=900&q=85" alt="Minimalist interior">
        <h3>Project Two</h3><p>Design & inspiration</p>
      </article>
      <article class="project">
        <img loading="lazy" src="https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=900&q=85" alt="Modern architecture">
        <h3>Project Three</h3><p>Architecture & ideas</p>
      </article>
      <article class="project">
        <img loading="lazy" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=85" alt="Landscape at sunrise">
        <h3>Project Four</h3><p>Photography & nature</p>
      </article>
    </div>
  </div>
</section>

<section id="About my music">
  <div class="container about-grid">
    <div class="initials">DR.</div>
    <div class="My music-copy">
      <p class="eyebrow">Sit back and relax</p>
      <p>I believe music is so much more than how we typically look at it. It not only creates a moment for our busy minds to completely dissolve from the world of thinking into the world of sensing. But it transforms us.</p>
      <p>Bringing us back to when we were young. Our little hand pointing towards that moving thing in the sky. The colors, shapes and lights touching us deeply. Bringing us back to how we lived before all this. Loved ones around the fire making songs to connect with the divine.</p>
      <p>Music resonates like nature resonates. Sun is sun. Rain is rain. There's nothing to think or analyze. It's boundless yet simple and clear.</p>
      <p>Most of all, music is coming home.</p>
      <a class="btn btn-light" href="#contact">Get in touch ↗</a>
    </div>
  </div>
</section>

<section id="contact">
  <div class="container contact-grid">
    <div class="contact-copy">
      <p class="eyebrow">Get in touch</p>
    </div>
    <div class="contact-links">
      <a class="contact-link" href="mailto:musicbydanielrose@gmail.com">
        <span><small>Email</small><strong>Send me an email</strong></span><span class="arrow">↗</span>
      </a>
      <a class="contact-link" href="https://www.youtube.com/@musicbytowardsthesun/" target="_blank" rel="noopener noreferrer">
        <span><small>Instagram</small><strong>Follow my updates</strong></span><span class="arrow">↗</span>
      </a>
    </div>
  </div>
</section>
</main>

<footer>
  <div class="container footer-inner">
    <a class="logo" href="#home">Daniel Rose<span>.</span></a>
    <p>© <span id="year"></span> Daniel Rose. All rights reserved.</p>
    <a href="#home">Back to top ↑</a>
  </div>
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

const menuToggle = document.getElementById("menuToggle");
const navLinks = document.getElementById("navLinks");

menuToggle.addEventListener("click", function () {
  const open = navLinks.classList.toggle("open");
  menuToggle.setAttribute("aria-expanded", String(open));
  menuToggle.textContent = open ? "Close ✕" : "Menu ☰";
});

navLinks.querySelectorAll("a").forEach(function (link) {
  link.addEventListener("click", function () {
    navLinks.classList.remove("open");
    menuToggle.setAttribute("aria-expanded", "false");
    menuToggle.textContent = "Menu ☰";
  });
});
</script>
</body>
</html>
